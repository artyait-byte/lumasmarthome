    <h1>If you searched LUMA and landed in the wrong place</h1>
    <p>LUMA Smart Home is a Sarasota, Florida residential technology studio. We are not luma.com (events), not Luma AI / Luma Labs, and not Snap One Luma cameras.</p>
    <p>Three other products share a word. This is the integrator on Florida’s Gulf Coast.</p>
    <p>LUMA Smart Home (lumasmarthome.com) designs and installs lighting control, motorized shades, audio, security, and networking for homes in Sarasota, Manatee, Charlotte, Lee, and Collier Counties. Phone +1 (941) 217-1616. Email hello@lumasmarthome.com.</p>
    <p>luma.com is an events and invitation platform. If you are trying to RSVP, host a gathering, or find an event link, that is a different company. We do not run events software.</p>
    <p>Luma AI (lumalabs.ai) builds generative video and 3D tools. If you searched for Dream Machine or a Luma Labs login, you want them. We install Lutron and UniFi in houses.</p>
    <p>Snap One sells a camera line named Luma, often through security dealers. If you have a Luma NVR sticker on a box in a closet, that is hardware we did not manufacture. When we spec cameras, we use UniFi Protect on-premise — your footage on your property. We can still look at an existing Snap One system and tell you whether to keep it.</p>
    <p>The longer entity page is LUMA Smart Home Sarasota. If a national result sent you here by accident, we hope the next click is the one you meant.</p>

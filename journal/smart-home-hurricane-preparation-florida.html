      "articleBody": "Power, shades and remote eyes. What a Gulf Coast system should do before, during and after a storm, and what it cannot do. Milton came ashore at Siesta Key in October 2024, two weeks after Helene pushed surge across Anna Maria and Longboat Key. Most Sarasota and Manatee owners now have a storm routine for the house: shutters, the generator, the patio furniture. Fewer have one for the systems inside it. Yet those systems decide whether you can see the house from Ohio, whether the rack survives the power coming back on twelve times, and whether a closed-up house sits at 80 percent humidity for a week without anyone knowing. This is how we prepare a smart home for hurricane season on the Gulf Coast. Some of it is equipment. Most of it is decisions made before June 1. Start with the honest limits. Interior motorized shades are not storm protection. A Lutron Sivoia QS roller or a Somfy drapery track will not stop debris or hold a pane together. Impact glass and rated shutters do that, and they belong to your builder and window contractor, not to us. Cameras do not prevent damage either. What a well-built system does is narrower and still valuable: it keeps the house observable, it protects its own electronics, it closes up the house in one press, and it tells you early when something is going wrong while you are not there. That last point matters more here than almost anywhere else. Peak hurricane season, August through October, is exactly when many Sarasota, Siesta Key and Longboat Key houses are empty. The owner is up north, the house is on Away, and the first sign of trouble is often a neighbor's text. A storm is rarely one outage. It is a dozen: flickers as the bands come through, a long drop when a feeder goes, then brownouts and surges while the utility restores the grid. That sequence is harder on electronics than a clean shutdown. A gateway or recorder that loses power mid-write can corrupt its storage, and a modem that comes back in the wrong order can leave the whole network unreachable until someone walks in and unplugs it. So the network closet gets three things. First, a properly sized UPS on the rack, carrying the UniFi gateway, the PoE switch and the camera recorder. If the house has a standby generator, the job of the UPS is to bridge the seconds before the transfer switch picks up so nothing hard-reboots. If there is no generator, it buys time to see the house go dark and record what happens next. Second, managed power, such as a WattBox, so outlets can be power-cycled remotely and the rack restarts in the right order after an outage instead of all at once. Third, surge protection at the rack, in addition to the whole-house surge device your electrician installs at the panel. Then there is the closet itself. In a raised house on Anna Maria Island or Longboat Key, the ground level is a flood zone by design. The rack does not go in the garage under the house, however convenient the cable runs look. It goes in conditioned space above the flood line, and we plan that on the drawings rather than after the drywall. More on how we build that layer on the networking page. In most neighborhoods the cable or fiber line goes down with the power, even if the house itself is on a generator. Without a second path, every camera and sensor in the house is recording to a box nobody can reach. A cellular backup, such as a UniFi LTE or 5G backup unit, gives the gateway a failover link that kicks in when the primary line drops. It will not carry a 4K camera wall, but it is enough for alerts, a few live views and remote diagnostics. Be realistic about it. Cell towers lose power in a major storm too, and some carriers recover faster than others. Pick the carrier with the best signal at the house, not the one on your phone, and test the failover in May, not during the first tropical storm warning. Where a house has motorized hurricane shutters or exterior rolling screens, they can sit on the same keypad and the same app as the interior shades. That turns closing the house from a forty-minute walk with a crank into one press, which matters when you are leaving early to beat the traffic on I-75. Somfy motors drive many of the exterior rolling products on the coast, and a Somfy wind sensor can retract exterior screens automatically when gusts build, before the fabric becomes a sail. We program a Storm scene that does the boring things in the right order: exterior screens up and secured, interior shades down to keep sun off the floors once the power and AC are out, landscape and pool lights off, cameras armed, and a notification to you that the house is closed. A matching Return scene opens everything back up, checks the network, and puts the house back on its normal schedule. If you are on Longboat Key or the other islands, check with the HOA before adding exterior hardware; boards there care about what the street can see. Cameras are the obvious part. UniFi Protect cameras on PoE draw power from the switch, so when the switch is on the UPS, the cameras stay up too, and the recorder keeps writing locally even when the internet is out. You can scroll back through the storm once the connection returns. A camera on the dock, one on the seawall side and one inside the garage usually tell you more after a storm than a dozen pointed at the street. Sensors tell you what cameras cannot. A leak sensor under the AC air handler, the water heater and the kitchen sink. A temperature and humidity sensor in the main living space and one in a closet. In a closed Florida house with the AC off after an outage, humidity climbs fast, and mold can take hold within days. An alert that the house has reached 70 percent humidity is your cue to call someone with a key, long before the drywall starts to smell. When power is restored, resist the urge to have someone flip everything on at once. Let the generator hand back to the utility, then let managed power bring the rack up in order. Check the recorder first, then the cameras, then the rest. If something did not come back, a remote diagnosis tells you whether it needs a technician or a reboot. That is the work our LUMA Care plans are built for. The Shoreline plan, at $75 a month, is designed for seasonal and lock-and-leave homes and includes weekday remote diagnostics on the gear we installed. If you want a storm review of an existing system, or you are building and want the rack, power and connectivity drawn correctly from the start, book a walkthrough. We will tell you what is worth adding and what is not. Will motorized shades protect my windows in a hurricane? No. Interior motorized shades are for sun, glare and privacy. Impact-rated glass or rated hurricane shutters protect the openings. If you have motorized shutters, we can put them on the same keypad and app as the shades so the house closes in one press. How long will my smart home keep running on a UPS? It depends on the size of the UPS and what it carries. We size it for the gateway, the PoE switch and the camera recorder. With a standby generator, the UPS only needs to bridge the transfer. Without one, it buys hours rather than days, so the network can report the outage and the cameras can record it. Can I see my cameras if the power and internet are out? The recorder keeps writing locally as long as the rack has power, so the footage is there when you reconnect. Live viewing from away needs a path out of the house, which is what a cellular backup on the gateway provides, as long as the local towers are up. What should I set before leaving for the summer? Test the UPS and the cellular failover, confirm cameras are recording locally, check leak and humidity sensor batteries, run the Storm scene once, and make sure someone local has a key. Then put the house on Away and keep alerts switched on."

    <p><a href="/">LUMA Smart Home</a> · Sarasota, FL · <a href="tel:+19414314640">+1 (941) 431-4640</a> · <a href="mailto:hello@lumasmarthome.com">hello@lumasmarthome.com</a></p>
    <h1>Smart home hurricane preparation in Florida</h1>
    <p>Getting a Florida smart home ready for hurricane season: backup power for the rack, shades and shutters, cameras and sensors you can check from away.</p>
    <p>Power, shades and remote eyes. What a Gulf Coast system should do before, during and after a storm, and what it cannot do.</p>
    <p>Milton came ashore at Siesta Key in October 2024, two weeks after Helene pushed surge across Anna Maria and Longboat Key. Most Sarasota and Manatee owners now have a storm routine for the house: shutters, the generator, the patio furniture. Fewer have one for the systems inside it. Yet those systems decide whether you can see the house from Ohio, whether the rack survives the power coming back on twelve times, and whether a closed-up house sits at 80 percent humidity for a week without anyone knowing.</p>
    <p>This is how we prepare a smart home for hurricane season on the Gulf Coast. Some of it is equipment. Most of it is decisions made before June 1.</p>
    <p>Start with the honest limits. Interior motorized shades are not storm protection. A Lutron Sivoia QS roller or a Somfy drapery track will not stop debris or hold a pane together. Impact glass and rated shutters do that, and they belong to your builder and window contractor, not to us. Cameras do not prevent damage either. What a well-built system does is narrower and still valuable: it keeps the house observable, it protects its own electronics, it closes up the house in one press, and it tells you early when something is going wrong while you are not there.</p>
    <p>That last point matters more here than almost anywhere else. Peak hurricane season, August through October, is exactly when many Sarasota, Siesta Key and Longboat Key houses are empty. The owner is up north, the house is on Away, and the first sign of trouble is often a neighbor's text.</p>
    <p>A storm is rarely one outage. It is a dozen: flickers as the bands come through, a long drop when a feeder goes, then brownouts and surges while the utility restores the grid. That sequence is harder on electronics than a clean shutdown. A gateway or recorder that loses power mid-write can corrupt its storage, and a modem that comes back in the wrong order can leave the whole network unreachable until someone walks in and unplugs it.</p>
    <p>So the network closet gets three things. First, a properly sized UPS on the rack, carrying the UniFi gateway, the PoE switch and the camera recorder. If the house has a standby generator, the job of the UPS is to bridge the seconds before the transfer switch picks up so nothing hard-reboots. If there is no generator, it buys time to see the house go dark and record what happens next. Second, managed power, such as a WattBox, so outlets can be power-cycled remotely and the rack restarts in the right order after an outage instead of all at once. Third, surge protection at the rack, in addition to the whole-house surge device your electrician installs at the panel.</p>
    <p>Then there is the closet itself. In a raised house on Anna Maria Island or Longboat Key, the ground level is a flood zone by design. The rack does not go in the garage under the house, however convenient the cable runs look. It goes in conditioned space above the flood line, and we plan that on the drawings rather than after the drywall. More on how we build that layer on the <a href="/networking">networking page</a>.</p>
    <p>In most neighborhoods the cable or fiber line goes down with the power, even if the house itself is on a generator. Without a second path, every camera and sensor in the house is recording to a box nobody can reach. A cellular backup, such as a UniFi LTE or 5G backup unit, gives the gateway a failover link that kicks in when the primary line drops. It will not carry a 4K camera wall, but it is enough for alerts, a few live views and remote diagnostics.</p>
    <p>Be realistic about it. Cell towers lose power in a major storm too, and some carriers recover faster than others. Pick the carrier with the best signal at the house, not the one on your phone, and test the failover in May, not during the first tropical storm warning.</p>
    <p>Where a house has motorized hurricane shutters or exterior rolling screens, they can sit on the same keypad and the same app as the interior shades. That turns closing the house from a forty-minute walk with a crank into one press, which matters when you are leaving early to beat the traffic on I-75. Somfy motors drive many of the exterior rolling products on the coast, and a Somfy wind sensor can retract exterior screens automatically when gusts build, before the fabric becomes a sail.</p>
    <p>We program a Storm scene that does the boring things in the right order: exterior screens up and secured, interior shades down to keep sun off the floors once the power and AC are out, landscape and pool lights off, cameras armed, and a notification to you that the house is closed. A matching Return scene opens everything back up, checks the network, and puts the house back on its normal schedule. If you are on <a href="/service-areas/longboat-key">Longboat Key</a> or the other islands, check with the HOA before adding exterior hardware; boards there care about what the street can see.</p>
    <p>Cameras are the obvious part. UniFi Protect cameras on PoE draw power from the switch, so when the switch is on the UPS, the cameras stay up too, and the recorder keeps writing locally even when the internet is out. You can scroll back through the storm once the connection returns. A camera on the dock, one on the seawall side and one inside the garage usually tell you more after a storm than a dozen pointed at the street.</p>
    <p>Sensors tell you what cameras cannot. A leak sensor under the AC air handler, the water heater and the kitchen sink. A temperature and humidity sensor in the main living space and one in a closet. In a closed Florida house with the AC off after an outage, humidity climbs fast, and mold can take hold within days. An alert that the house has reached 70 percent humidity is your cue to call someone with a key, long before the drywall starts to smell.</p>
    <p>When power is restored, resist the urge to have someone flip everything on at once. Let the generator hand back to the utility, then let managed power bring the rack up in order. Check the recorder first, then the cameras, then the rest. If something did not come back, a remote diagnosis tells you whether it needs a technician or a reboot. That is the work our <a href="/support">LUMA Care plans</a> are built for. The Shoreline plan, at $75 a month, is designed for seasonal and lock-and-leave homes and includes weekday remote diagnostics on the gear we installed.</p>
    <p>If you want a storm review of an existing system, or you are building and want the rack, power and connectivity drawn correctly from the start, <a href="/contact">book a walkthrough</a>. We will tell you what is worth adding and what is not.</p>
    <p>Will motorized shades protect my windows in a hurricane? No. Interior motorized shades are for sun, glare and privacy. Impact-rated glass or rated hurricane shutters protect the openings. If you have motorized shutters, we can put them on the same keypad and app as the shades so the house closes in one press.</p>
    <p>How long will my smart home keep running on a UPS? It depends on the size of the UPS and what it carries. We size it for the gateway, the PoE switch and the camera recorder. With a standby generator, the UPS only needs to bridge the transfer. Without one, it buys hours rather than days, so the network can report the outage and the cameras can record it.</p>
    <p>Can I see my cameras if the power and internet are out? The recorder keeps writing locally as long as the rack has power, so the footage is there when you reconnect. Live viewing from away needs a path out of the house, which is what a cellular backup on the gateway provides, as long as the local towers are up.</p>
    <p>What should I set before leaving for the summer? Test the UPS and the cellular failover, confirm cameras are recording locally, check leak and humidity sensor batteries, run the Storm scene once, and make sure someone local has a key. Then put the house on Away and keep alerts switched on.</p>

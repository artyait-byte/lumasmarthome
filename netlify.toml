# ----- Security & performance headers --------------------------------------
[[headers]]
  for = "/*"
  [headers.values]
    # NOTE: X-Frame-Options removed and frame-ancestors widened so the live
    # site can be embedded in design previews (canvas/iframe). This is a
    # marketing site with no authenticated actions, so clickjacking risk is
    # negligible. If we add a login flow later, tighten frame-ancestors.
    X-Content-Type-Options = "nosniff"
    Referrer-Policy        = "strict-origin-when-cross-origin"
    Permissions-Policy     = "camera=(), microphone=(), geolocation=(self)"
    # CSP:
    #   - 'unsafe-eval' is required because Babel standalone transpiles JSX in-browser.
    #   - 'unsafe-inline' allows inline JSON-LD and window.__LUMA_PAGE.
    #   - unpkg.com hosts React, ReactDOM, Babel.
    #   - connect-src 'self' lets Babel fetch /js/app.js.
    Content-Security-Policy = "default-src 'self'; img-src 'self' data: blob: https://images.unsplash.com https://images.pexels.com https://*.basemaps.cartocdn.com https://*.tile.openstreetmap.org; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://unpkg.com; connect-src 'self'; frame-ancestors *; base-uri 'self'; form-action 'self';"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/brochure.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/_archive/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

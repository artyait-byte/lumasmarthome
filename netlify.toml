# LUMA Smart Home — Netlify deployment config
# https://docs.netlify.com/configure-builds/file-based-configuration/

[build]
  publish = "."
  # No build step: single-file React SPA (loaded via CDN React + Babel standalone).
  command = "echo 'No build step — static SPA'"

# ----- Redirects ----------------------------------------------------------
# All previous multi-page URLs now collapse onto the SPA root. The SPA
# handles its own internal navigation; bookmarks fall back to the home view.
[[redirects]]
  from   = "/contact"
  to     = "/"
  status = 301

[[redirects]]
  from   = "/contact.html"
  to     = "/"
  status = 301

[[redirects]]
  from   = "/about"
  to     = "/?p=about"
  status = 302

[[redirects]]
  from   = "/about.html"
  to     = "/?p=about"
  status = 302

[[redirects]]

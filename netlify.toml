# LUMA Smart Home — Netlify deployment config
# https://docs.netlify.com/configure-builds/file-based-configuration/

[build]
  publish = "."
  # Rebuild crawlable HTML shells (unique title/canonical per URL).
  # Shared SPA is /js/app.js — do not inline it into every page.
  command = "python3 scripts/generate-seo-pages.py"

# ----- Legacy URL → public path -------------------------------------------
# Real HTML files now exist for /lighting, /about, /work, etc.
# Do NOT 301 those paths back to /. Google was collapsing the site to one URL.

[[redirects]]
  from   = "/projects"
  to     = "/work"
  status = 301


# ----- Security & performance headers --------------------------------------
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options        = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy        = "strict-origin-when-cross-origin"
    Permissions-Policy     = "camera=(), microphone=(), geolocation=(self)"
    # CSP for the Claude Design SPA prototype:
    #   - 'unsafe-eval' is required because Babel standalone transpiles JSX in-browser.
    #   - 'unsafe-inline' allows the inline <style> and <script type="text/babel"> blocks.
    #   - unpkg.com hosts React, ReactDOM, Babel.
    #   - Image sources include Unsplash + Pexels CDNs used by the design.
    #   - Google Fonts (Cormorant Garamond + DM Sans).
    Content-Security-Policy = "default-src 'self'; img-src 'self' data: blob: https://images.unsplash.com https://images.pexels.com https://*.basemaps.cartocdn.com https://*.tile.openstreetmap.org; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://unpkg.com; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self';"

# Long cache for hashed assets / images.
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# HTML should revalidate.
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
